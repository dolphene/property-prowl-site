name: Refresh site data

on:
  schedule:
    # A few hours after property-prowl's own refresh (Mon & Thu 22:00 UTC).
    - cron: "0 2 * * 2,5"
  workflow_dispatch: {}
  repository_dispatch:
    types: [upstream-data-updated]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild site data from property-prowl's published JSON
        env:
          PROWL_DATA_URL: https://dolphene.github.io/property-prowl/master_quarterly_signals.json
        run: python scripts/build_site_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "prowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh site data $(date -u +%Y-%m-%d)"
          git push
